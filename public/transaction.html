<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실거래 상세</title>
    <!-- 빌드 없이 쓰는 Tailwind 브라우저 빌드. 런타임에 CSS를 만들므로 운영 배포 전에는 standalone CLI로 대체한다. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- 시간 축을 쓰려면 날짜 어댑터를 Chart.js 다음에 불러와야 한다. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script type="module" src="/transaction.js"></script>
    <script type="module" src="/auth.js"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-4xl items-center justify-between px-4 py-3">
        <a href="/" class="font-bold">부동산 실거래 조회</a>
        <!-- 로그인 여부를 확인하기 전에는 비워 두되 자리를 잡아 버튼이 나타날 때 레이아웃이 밀리지 않게 한다. -->
        <nav id="auth-nav" class="h-8 min-w-20 text-right"></nav>
      </div>
    </header>
    <main class="mx-auto max-w-4xl px-4 py-8">
      <button
        id="back"
        type="button"
        class="mb-6 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-100"
      >
        ← 목록으로
      </button>

      <p id="message" class="hidden rounded-lg bg-white p-6 text-center text-sm text-slate-500 shadow-sm"></p>

      <div id="detail" class="hidden space-y-6">
        <section class="rounded-xl bg-white p-6 shadow-sm">
          <div id="badges" class="mb-2 flex flex-wrap items-center gap-1.5 text-xs"></div>
          <h1 id="title" class="text-2xl font-bold"></h1>
          <p id="address" class="mt-1 text-sm text-slate-500"></p>
          <p id="price" class="mt-4 text-3xl font-bold text-blue-700"></p>
          <dl id="info" class="mt-6 grid grid-cols-2 gap-x-6 gap-y-3 text-sm sm:grid-cols-3"></dl>
        </section>

        <section class="rounded-xl bg-white p-6 shadow-sm">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="text-lg font-semibold">실거래가 추이</h2>
              <p id="trend-caption" class="text-sm text-slate-500"></p>
            </div>
            <div id="trend-controls" class="hidden flex-wrap items-center gap-3">
              <div id="series-tabs" class="flex gap-1"></div>
              <div id="period-buttons" class="flex gap-1"></div>
            </div>
          </div>
          <p id="trend-note" class="mt-2 hidden text-xs text-slate-500"></p>
          <div id="chart-wrapper" class="relative mt-4 hidden h-72">
            <canvas id="chart"></canvas>
          </div>
          <p id="trend-message" class="mt-4 hidden py-12 text-center text-sm text-slate-500"></p>
        </section>
      </div>
    </main>
  </body>
</html>
