<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>실거래 목록</title>
    <!-- 빌드 없이 쓰는 Tailwind 브라우저 빌드. 런타임에 CSS를 만들므로 운영 배포 전에는 standalone CLI로 대체한다. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.min.js"
      integrity="sha384-aJ9rL4k6lF+91guGvUFVSkpIcge7Zd9EiI4TQDLoK9kFaFJgKHgjEXVvG/qA5COj"
      crossorigin="anonymous"></script>
    <script type="module" src="/transactions.js"></script>
    <script type="module" src="/auth.js"></script>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
        <a href="/" class="font-bold">부동산 실거래 조회</a>
        <!-- 로그인 여부를 확인하기 전에는 비워 두되 자리를 잡아 버튼이 나타날 때 레이아웃이 밀리지 않게 한다. -->
        <nav id="auth-nav" aria-label="계정" class="h-8 min-w-20 text-right"></nav>
      </div>
    </header>
    <main class="mx-auto max-w-7xl px-4 py-8">
      <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <h1 id="summary" class="text-xl font-bold">실거래 목록</h1>
        <a href="/" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-sm hover:bg-slate-100">조건 변경</a>
      </div>

      <p id="message" class="mb-4 hidden rounded-lg bg-white p-6 text-center text-sm text-slate-500 shadow-sm"></p>

      <div id="table-wrapper" class="hidden overflow-x-auto rounded-xl bg-white shadow-sm">
        <table class="min-w-full text-sm">
          <thead class="border-b border-slate-200 bg-slate-100 text-slate-600">
            <tr id="table-head"><th scope="col">거래</th></tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>

      <nav id="pagination" aria-label="페이지 이동" class="mt-4 hidden items-center justify-center gap-4 text-sm">
        <a id="prev-page" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5">이전</a>
        <span id="page-number" class="text-slate-600"></span>
        <a id="next-page" class="rounded-lg border border-slate-300 bg-white px-3 py-1.5">다음</a>
      </nav>
    </main>
  </body>
</html>
