services:
  postgres:
    image: postgres:18
    container_name: prop-trend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prop_trend
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prop_trend"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API를 띄우기 전에 스키마를 마지막 리비전으로 올리고 끝난다.
  migrate:
    build:
      context: ./api
      additional_contexts:
        public: ./public
    container_name: prop-trend-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prop_trend
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      additional_contexts:
        public: ./public
    container_name: prop-trend-api
    restart: unless-stopped
    # api/.env는 읽지 않는다. 오픈API 인증키는 파이프라인만 쓰고, 접속 주소는 아래에서 준다.
    environment:
      # 컨테이너 안의 localhost는 자기 자신이므로 컨테이너 네트워크 주소를 쓴다.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prop_trend
      TZ: Asia/Seoul
    # 이미지에도 public/이 들어 있지만, 마운트해 두면 JS를 고칠 때 다시 빌드하지 않아도 된다.
    volumes:
      - ./public:/app/public:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        # 기동 직후엔 아직 접속을 못 받으므로 healthcheck 통과를 기다린다.
        condition: service_healthy
      # 마이그레이션이 실패하면 옛 스키마로 뜨지 않게 성공으로 끝나야 띄운다.
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # slim 이미지에 curl이 없어 파이썬으로 확인한다.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 정기 갱신이 남긴 신규 거래 이벤트를 읽어 인앱 알림을 만든다. API와 같은 이미지로 진입점만 바꾼다.
  worker:
    build:
      context: ./api
      additional_contexts:
        public: ./public
    container_name: prop-trend-worker
    restart: unless-stopped
    command: ["python", "-m", "src.notification_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prop_trend
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      # 대기열 테이블이 생긴 뒤에 뜬다.
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
