services:
  postgres:
    image: postgres:18
    container_name: prop-trend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prop_trend
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prop_trend"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: prop-trend-api
    restart: unless-stopped
    # api/.env는 읽지 않는다. 오픈API 인증키는 파이프라인만 쓰고, 접속 주소는 아래에서 준다.
    environment:
      # 컨테이너 안의 localhost는 자기 자신이므로 컨테이너 네트워크 주소를 쓴다.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/prop_trend
      # 호스트 환경변수나 루트 .env에서 받는다. 앱도 기동 시 검증하지만 compose 단계에서 먼저 막는다.
      API_KEY: ${API_KEY:?API_KEY must be set}
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        # 기동 직후엔 아직 접속을 못 받으므로 healthcheck 통과를 기다린다.
        condition: service_healthy
    healthcheck:
      # slim 이미지에 curl이 없어 파이썬으로 확인한다.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
