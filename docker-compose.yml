services:
  postgres:
    image: postgres:18
    container_name: prop-trend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prop_trend
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prop_trend"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
