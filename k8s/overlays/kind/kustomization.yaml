# 로컬 kind 클러스터용. DB를 클러스터 안에 띄운다. 이미지 태그는 kind.sh가 kind load로 넣은 것으로 채운다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prop-trend
resources:
  - namespace.yaml
  - postgres.yaml
  - ../../base
secretGenerator:
  # 로컬 전용 DB라 비밀번호를 그대로 적는다. EKS에서는 Terraform이 같은 이름의 Secret을 만든다.
  - name: api-db
    literals:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/prop_trend
    options:
      disableNameSuffixHash: true
