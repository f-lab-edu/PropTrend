[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.31.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# 기본 활성 룰(415개)에 pylint 포팅 룰과 보안·복잡도 룰을 더한다.
extend-select = [
    "E",    # pycodestyle error (E402 임포트 위치 등)
    "W",    # pycodestyle warning
    "I",    # isort
    "N",    # pep8-naming
    "S",    # flake8-bandit (보안)
    "C901", # mccabe 순환 복잡도
    "PL",   # pylint 포팅 룰 (인자 수, 지역변수 수 등)
    "TRY",  # 예외 처리 안티패턴
    "DTZ",  # 타임존 없는 datetime
]
ignore = [
    "RUF001", # 한글 문자열의 유니코드 모호성 경고
    "RUF002", # 한글 docstring의 유니코드 모호성 경고
    "RUF003", # 한글 주석의 유니코드 모호성 경고
    "TRY003", # 예외 메시지를 raise 지점에 직접 두는 방식을 허용
]

[tool.ruff.lint.mccabe]
# SonarCloud의 인지 복잡도 기본 임계값과 맞춘다.
max-complexity = 15

[tool.ruff.lint.pep8-naming]
# declared_attr.directive는 self가 아닌 cls를 받는다.
classmethod-decorators = ["sqlalchemy.orm.declared_attr.directive"]

[tool.ruff.lint.per-file-ignores]
# raw 테이블은 오픈API 응답 필드명을 그대로 보존하므로 camelCase를 허용한다.
"src/model/raw.py" = ["N815"]
# 엔진과 세션 팩토리를 최초 호출 시점에 한 번만 만드는 지연 초기화 싱글턴이다.
"src/db.py" = ["PLW0603"]
