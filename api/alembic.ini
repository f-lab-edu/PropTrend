# 스키마 마이그레이션 설정. api/에서 `uv run alembic ...`으로 실행한다.
# 접속 주소는 여기 두지 않고 migrations/env.py가 앱과 같은 DATABASE_URL을 읽는다.

[alembic]
script_location = %(here)s/migrations
# env.py가 src.model을 import하도록 api/를 경로에 올린다.
prepend_sys_path = %(here)s
path_separator = os
# 파일 이름만으로 만든 순서를 알 수 있게 날짜를 앞에 붙인다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]
# autogenerate가 만든 파일이 ruff 검사를 바로 통과하게 한다.
hooks = ruff_format, ruff_check
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
